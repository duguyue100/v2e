[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "v2e"
version = "2.0.0"
description = "Generates synthetic DVS events from video"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Tobi Delbruck" },
    { name = "Yuhuang Hu" },
    { name = "Zhe He" },
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "torch",
    "torchvision",
    "opencv-python",
    "h5py",
    "pydantic>=2.0",
    "tqdm",
    "engineering-notation",
    "matplotlib",
    "scikit-image",
    "screeninfo",
    "easygui",
]

[project.optional-dependencies]
numba = ["numba>=0.58"]
aedat4 = ["dv-processing>=1.7.8", "numpy<2.0"]
gui = ["Gooey>=1.0.3"]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    "pre-commit",
]

[project.scripts]
v2e = "v2e:main"

[tool.ruff]
extend-exclude = ["*.ipynb", "legacy/*", "examples/*"]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
extend-select = [
    # Enable the isort rules.
    "I",
    # Enable all `pydocstyle` rules, limiting to those that adhere to the
    # Google convention via `convention = "google"`, below.
    "D",
    # Doc line length.
    "W505",
    # Check for breakpoint() statements
    "T10",
    # Enable warnings for f-strings in log messages.
    "G004",
    # Too many log message arguments.
    "PLE1205",
    # Too few log message arguments.
    "PLE1206",
    # Enable panda lints.
    "PD",
    # Do not create a sequence just to get the first item.
    "RUF015",
    # Prefer itertools.pairwise() over zip() when iterating over successive pairs.
    "RUF007",
    # Avoid quadratic list summation (sum() is quadratic in the number of given lists).
    "RUF017",
    # Sort __all__ entries.
    "RUF022",
    # Checks for member imports that should instead be accessed by importing the module.
    "ICN003",
    # Checks for uses of PEP 585- and PEP 604-style type annotations in Python modules
    # that lack the required `from __future__ import annotations` import for
    # compatibility with older Python versions.
    "FA102",
    # Checks for banned imports (see [lint.flake8-tidy-imports.banned-api] below)
    "TID251",
    # Checks for uses of the try-except-pass pattern.
    "S110",
]
ignore = [
    "E203",
    "E501",
    # On top of the Google convention, disable `D417`, which requires
    # documentation for every function parameter.
    "D417",
    # Missing docstring in public module
    "D100",
    # Missing docstring in public class
    "D101",
    # Missing docstring in public method
    "D102",
    # Missing docstring in public function
    "D103",
    # Missing docstring in public package
    "D104",
    # Missing docstring in magic method
    "D105",
    # Missing docstring in `__init__`
    "D107",
    # 1 blank line required between summary line and description.
    # This is needed because sometimes our summaries span multiple lines.
    "D205",
    # Multi-line docstring closing quotes should be on a separate line
    # This is a result of summary lines spanning more than one line.
    "D209",
    # Multi-line docstring summary should start at the first line.
    "D212",
    # Use `r"""` if any backslashes in a docstring.
    "D301",
    # First line should end with a period, question mark, or exclamation point
    "D415",
    # inplace=True should be avoided; it has inconsistent behavior
    "PD002",
    # Checks for uses of .pivot or .unstack on Pandas objects.
    "PD010",
    # Use .to_numpy() instead of .values.
    "PD011",
    # Use .merge method instead of pd.merge function. They have equivalent functionality.
    "PD015",
    # Avoid using the generic variable name df for DataFrames.
    "PD901",
    # Doc line too long. This is needed because we have ~400 errors otherwise.
    "W505",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true
skip-magic-trailing-comma = true

[tool.ruff.lint.isort]
order-by-type = false
case-sensitive = false
split-on-trailing-comma = true
force-single-line = true
lines-after-imports = 2
known-first-party = ["v2ecore"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
exclude = ["^legacy/", "^examples/", ".*\\.ipynb$"]

# Gradual adoption: ignore errors in legacy modules initially
[[tool.mypy.overrides]]
module = [
    "legacy.*",
]
ignore_errors = true

# Third-party stubs
[[tool.mypy.overrides]]
module = [
    "cv2.*",
    "numba.*",
    "dv_processing.*",
    "engineering_notation.*",
    "screeninfo.*",
    "h5py.*",
    "tqdm.*",
    "v2ecore.v2e_utils",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-q",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests requiring GPU",
]
